name: Metrics CI

on:
  push:
    branches: [main, master]
    paths:
      - 'scripts/**'
      - 'docs/**'
      - '.github/**'
  pull_request:
    paths:
      - 'scripts/**'
      - 'docs/**'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate metrics scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile metrics snapshot script
        run: python -m py_compile scripts/github_metrics_snapshot.py
      - name: Validate ai-attribution JSON
        run: python -c "import json; json.load(open('docs/ai-attribution.json', encoding='utf-8'))"
