name: Deploy Metrics Bundle

# Records a successful production deployment in GitHub (Deployments API) after CI
# passes on main. Metrics collectors use these events for deployment frequency
# and lead time to production. Replace the environment URL with your real host.

on:
  workflow_run:
    workflows: [Metrics CI]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Record production deployment
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://github.com/${{ github.repository }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate before deploy
        run: python -m py_compile scripts/github_metrics_snapshot.py

      - name: Create GitHub deployment
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const ref =
              context.payload.workflow_run?.head_sha ?? context.sha;
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref,
              environment: "production",
              auto_merge: false,
              required_contexts: [],
              description: "GitHub metrics bundle deployment record",
            });
            core.setOutput("id", deployment.data.id);

      - name: Mark deployment successful
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
        with:
          script: |
            const deploymentId = Number(process.env.DEPLOYMENT_ID);
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deploymentId,
              state: "success",
              environment: "production",
              description: "Metrics bundle deployment recorded for engineering metrics",
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
