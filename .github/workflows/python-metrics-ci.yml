name: Python Metrics Demo CI

on:
  push:
    branches: [main, master]
    paths:
      - 'python-metrics-demo/**'
      - '.github/workflows/python-metrics-ci.yml'
  pull_request:
    paths:
      - 'python-metrics-demo/**'
      - '.github/workflows/python-metrics-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: python-metrics-demo
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python-metrics-demo/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
