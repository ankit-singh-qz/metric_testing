name: Feature request
description: Propose a change with a clear outcome and acceptance criteria.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What user or engineering problem does this address?
      placeholder: Describe the current limitation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: What should happen when this is complete?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Provide concrete, verifiable criteria.
    validations:
      required: true
  - type: checkboxes
    id: ai
    attributes:
      label: AI assistance
      options:
        - label: I expect to use AI assistance and will disclose it in the PR.
          required: false
